<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="inv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="#0B0F19" />
  <!-- Invoice sheet outline with corner fold -->
  <path d="M26 24 H62 L74 36 V76 H26 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="2.5" />
  <path d="M62 24 V36 H74" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Minimalist stylized 'X' / Checkmark in center -->
  <path d="M38 42 L62 66" stroke="url(#inv-grad)" stroke-width="7" stroke-linecap="round" />
  <path d="M62 42 L38 66" stroke="url(#emerald-grad)" stroke-width="7" stroke-linecap="round" />
  <!-- Tiny dot for precision -->
  <circle cx="68" cy="68" r="3.5" fill="#10B981" />
</svg>
